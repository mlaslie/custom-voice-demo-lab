[project]
name = "demolab"
version = "0.1.3"
description = "Voice Demo Lab: narrated demo videos of web apps and slide decks in your custom Gemini TTS voice."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pydantic>=2.9",
  "playwright>=1.48",
  "pillow>=11",
  "python-pptx>=1.0",
  "pypdfium2>=4.30",
  "keyring>=25",
  "mcp>=1.2",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.150",
]

[project.scripts]
demolab = "demolab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demolab"]

[dependency-groups]
dev = ["pytest>=8"]
