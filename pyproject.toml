[project]
name = "demolab"
version = "0.5.0"
description = "Voice Demo Lab: Antigravity-first plugin for automated, research-grounded narrated demo videos from slides and websites."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pillow>=11",
  "python-pptx>=1.0",
  "pypdfium2>=4.30",
  "keyring>=25",
  "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demolab"]

[dependency-groups]
dev = ["pytest>=8"]
